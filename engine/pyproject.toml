[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "integrate-pbr-engine"
version = "0.1.0"
description = "Local model engine for Minecraft texture material analysis and LabPBR compilation"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "Pillow>=10,<13"]

[project.optional-dependencies]
train = ["torch>=2.7,<3", "safetensors>=0.5,<1", "PyYAML>=6,<7"]
onnx = ["onnx>=1.17,<2", "onnxruntime>=1.20,<2"]

[project.scripts]
integrate-pbr-engine = "integratepbr_engine.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

